<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>訂單彙總／撿貨清單工具</title>
  <meta name="description" content="把 CRM 匯出的訂單 Excel 轉成收件人清單與撿貨清單。檔案只在你的裝置上處理，不會上傳。">
  <meta name="theme-color" content="#2f7d32" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14231a" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="撿貨清單">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/exceljs.bare.min.js" defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="32" height="32">
      <h1>訂單彙總／撿貨清單</h1>
    </div>
    <div class="header-actions">
      <span id="offline-badge" class="badge" hidden>離線中</span>
      <button id="install-btn" class="btn small" type="button" hidden>安裝 App</button>
    </div>
  </header>

  <div id="update-banner" class="banner" role="status" hidden>
    <span>有新版本可以使用了。</span>
    <button id="update-btn" class="btn small" type="button">立即更新</button>
  </div>

  <main>
    <section class="card" aria-labelledby="step1-title">
      <h2 id="step1-title">1. 選擇 CRM 匯出檔</h2>
      <p class="hint">可一次選多個 <code>.xlsx</code> / <code>.xlsm</code> 檔。欄位依「表頭文字」自動對應，每個檔案各自獨立解析。</p>

      <label class="dropzone" id="dropzone">
        <input type="file" id="file-input" multiple
               accept=".xlsx,.xlsm,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel.sheet.macroEnabled.12">
        <span class="dz-title">點此選擇檔案</span>
        <span class="dz-sub">或把檔案拖放到這裡</span>
      </label>

      <ul id="file-list" class="file-list" aria-label="已選擇的檔案"></ul>

      <div class="actions">
        <button id="run-btn" class="btn primary" type="button" disabled>產生收件人清單＋撿貨清單</button>
        <button id="clear-btn" class="btn" type="button" hidden>全部清除</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p id="ios-hint" class="hint" hidden>想像 App 一樣使用：點 Safari 底部的「分享」→「加入主畫面」。</p>
    </section>

    <section id="result" class="card" aria-labelledby="result-title" aria-live="polite" hidden>
      <h2 id="result-title">2. 結果</h2>
      <div id="result-body"></div>
    </section>
  </main>

  <footer>
    <p>🔒 所有資料只在這台裝置上處理，不會上傳到任何伺服器；安裝後可離線使用。</p>
    <p class="muted">由 order_tool.exe 移植而來 · <span id="version"></span></p>
  </footer>
</body>
</html>
